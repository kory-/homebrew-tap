name: Validate Prisma cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install the checked-out cask
        run: |
          test "$(uname -m)" = arm64
          brew tap kory-/tap "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/PrismaApplications"
          brew install --cask --appdir="$RUNNER_TEMP/PrismaApplications" kory-/tap/prisma
      - name: Verify installed app
        run: |
          prisma_app="$RUNNER_TEMP/PrismaApplications/Prisma.app"
          test -d "$prisma_app"
          codesign --verify --deep --strict "$prisma_app"
          test "$(lipo -archs "$prisma_app/Contents/MacOS/Prisma")" = arm64
          python3 - "$prisma_app" <<'PY'
          import json, pathlib, plistlib, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          metadata = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          cask = json.loads(subprocess.check_output([
              "brew", "info", "--cask", "--json=v2", "kory-/tap/prisma"
          ]))["casks"][0]
          assert metadata["CFBundleIdentifier"] == "local.appmixer.desktop"
          assert metadata["CFBundleShortVersionString"] == cask["version"]
          assert metadata["LSMinimumSystemVersion"] == "14.4"
          assert (app / "Contents/Resources/ChromeExtension/manifest.json").is_file()
          print("Installed app matches cask version and platform requirements.")
          PY
      - name: Homebrew style and online audit
        run: |
          brew style --cask kory-/tap/prisma
          brew audit --cask --online kory-/tap/prisma
          brew livecheck --cask kory-/tap/prisma
      - name: Verify uninstall
        if: always()
        run: |
          if brew list --cask kory-/tap/prisma >/dev/null 2>&1; then
            brew uninstall --cask kory-/tap/prisma
          fi
          test ! -d "$RUNNER_TEMP/PrismaApplications/Prisma.app"
